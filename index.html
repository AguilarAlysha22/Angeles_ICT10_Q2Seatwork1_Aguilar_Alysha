<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glee Club Candidate Checker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

        body {
            background-color: #f2eee3;
            font-family: 'Montserrat', Arial, sans-serif;
            color: #075b6b;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        body.container {
            background-color: #fffdf7;
            margin: 35px auto;
            padding: 35px;
            border: 5px solid #0b9290;
            border-radius: 8px;
            max-width: 750px;
        }
        h1 {
            color: #075b6b;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            text-align: center;
        }
        input {
            border: 2px solid #d8d4c8;
            border-radius: 5px;
            padding: 12px;
            font-family: inherit;
            margin-bottom: 12px;
        }
        button {
            color: #d8d4c8;
            width: 100%;
            background-color: #b5123e;
            border: none;
            border-radius: 5px;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
        }
        button:hover {
            background-color: #075b6b;
        }
        h3 {
            color: #b5123e;
            font-weight: bold;
            margin-top: 28px;
            border-bottom: 3px solid #e8bd57;
            padding-bottom: 8px;
        }
        #output {
            background-color: #f5f0e5;
            color: #075b6b;
            border-left: 5px solid #0b9290;
            padding: 18px;
            margin-top: 15px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body class="container mt-5">
    <h1>GLEE CLUB CANDIDATE CHECKER</h1>
    <p>Enter your first name and last name to verify if you are a member.</p>

    <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
    <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">

    <button type="button" py-click="check_name">ENTER</button>

    <h3 class="mt-4">Result</h3>
    <p id="output"></p>

    <py-script src="main.py"></py-script>
</body>
</html>
